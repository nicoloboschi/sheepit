name: Release

# Fires when a version tag is pushed (e.g. `v1.2.0`), which `release.sh` does.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # node-pty compiles from source on Linux; ubuntu-latest already has
      # python3 + build-essential, so a plain install works.
      - name: Install dependencies
        run: npm ci

      # The UI is a separate package with its own lockfile; `prepack` builds it
      # (`cd ui && vite build`), so its deps must be installed too.
      - name: Install UI dependencies
        run: npm --prefix ui ci

      - name: Test
        run: npm test

      # Build BEFORE publish, explicitly — do not leave it to `prepack`.
      # npm reads and normalizes package.json before it runs prepack, so on a
      # fresh checkout `dist/index.js` does not exist yet at that moment and
      # npm drops the `bin` entry as invalid ("No bin file found at
      # dist/index.js" -> "bin[sheepit] ... was invalid and removed"). The
      # package then publishes cleanly and installs with no `sheepit` command
      # at all, which is exactly how 1.7.0 shipped.
      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          # Add this as a repo secret: Settings → Secrets and variables → Actions
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # auto-changelog from commits/PRs since last tag
