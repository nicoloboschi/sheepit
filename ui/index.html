<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page extend under the system bars and, in
         exchange, makes env(safe-area-inset-*) report their real sizes — which
         is how style.css derives --safe-top / --safe-bottom. Required for the
         Android app, where the window always draws edge-to-edge.
         interactive-widget=resizes-visual keeps the keyboard as a *visual*
         viewport change, which App.tsx already tracks. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual, viewport-fit=cover" />
    <!-- Real 🐑 rasterised onto the pasture plate (see ui/public/icon-*.png).
         An emoji-in-SVG data: favicon depends on the OS emoji font being
         reachable from the favicon rasteriser, which is not true everywhere —
         PNGs render the same sheep on every platform. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0d0a" />
    <!-- Self-hosted (see ui/public/fonts, regenerate with scripts/selfhost-fonts.py).
         Loading these from fonts.googleapis.com would block first paint on a
         network round-trip, and the Android APK often talks to a dataplane on a
         LAN with no internet route, where that request just times out. -->
    <link rel="preload" href="/fonts/jetbrains-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-600-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>sheepit 🐑</title>
    <style>:root { --vvh: 100dvh; }</style>
  </head>
  <body class="h-full">
    <div id="root" class="h-full overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
